name: chat_app_flutter
description: "Chat App made in flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: 4.0.7
  cookie_jar: 4.0.9
  dio: 5.11.1
  dio_cookie_manager: 3.5.0
  events_emitter: 0.6.0
  http: 1.6.0
  intl: 0.20.3
  path_provider: 2.1.6
  video_player: 2.14.1
  video_player_win: 3.3.1
  material_ui: 1.11.1
  window_manager: 0.7.0

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
